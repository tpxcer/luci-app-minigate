name: Build and publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          version=$(sed -n 's/^PKG_VERSION="\([^"]*\)"/\1/p' scripts/build-ipk.sh)
          release=$(sed -n 's/^PKG_RELEASE="\([^"]*\)"/\1/p' scripts/build-ipk.sh)
          if [ -z "$version" ] || [ -z "$release" ]; then
            echo "Failed to read package version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build IPK
        shell: bash
        run: |
          chmod +x scripts/build-ipk.sh
          scripts/build-ipk.sh "$PWD/dist"

      - name: Build source archive
        shell: bash
        run: |
          tar --exclude=.git --exclude=dist -czf "dist/luci-app-minigate-v${{ steps.meta.outputs.version }}-src.tar.gz" .
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE: ${{ steps.meta.outputs.release }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          MiniGate v${VERSION}-${RELEASE}

          更新内容：
          - 修复 ACME 重复签发/续期失败时，即使已有有效证书仍把 SSL/TLS 状态误标为 error 的问题。
          - ACME 失败但现有证书未过期时，会保留 ok 状态并记录最近错误，避免总览页误报证书失效。
          - 修复 LuCI 手动签发证书、手动同步 DDNS 时命令参数未做安全引用的问题。
          - 对总览页、证书页、登录防护页中的域名、证书、访问记录、归属地等动态文本做 HTML 转义。

          说明：
          - 旧版 Release 附件不会自动变化，请下载当前版本的 luci-app-minigate_${VERSION}-${RELEASE}_all.ipk。
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "luci-app-minigate v${VERSION}" --notes-file release-notes.md --latest
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "luci-app-minigate v${VERSION}" --notes-file release-notes.md --latest
          fi
